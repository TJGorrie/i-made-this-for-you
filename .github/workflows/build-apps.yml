# Builds the standalone app on each OS (scripts/build-app.ts). Push a tag like v0.2.0 to publish a GitHub release
# with all of them; or run it by hand from the Actions tab and download the files from the run.
name: Build apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel builds for Intel Macs; ubuntu-24.04-arm for ARM Linux.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:app
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
